# 저장소 경로: FE/nginx.conf 로 저장하세요.
# React Router(react-router-dom) SPA 라우팅 대응 + 백엔드 API 리버스 프록시
#
# 백엔드에 새 API 경로(prefix)가 추가되면 이 파일에 location 블록을 추가해주세요.
#
# 그 경로가 프론트 라우트(FE/src/routes.js)와 접두사를 공유한다면 아래 다른 블록들처럼
# Accept: text/html 분기도 같이 넣어야 합니다. 안 넣으면 그 경로에서 새로고침할 때
# 화면 대신 401 JSON이 뜹니다.
# /me, /notifications 는 GET /me(마이페이지), GET /me/scans(스캔 이력), GET /notifications*
# 컨트롤러가 openapi.yaml 스펙대로 루트 경로에 매핑돼 있어서 추가함 (com.dpp.mypage / com.dpp.notify).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /me {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /me/ {
        # 브라우저 주소창 이동·새로고침이면 API가 아니라 SPA를 준다.
        #
        # 프론트 라우트(/admin/dashboard, /customs/clearance, /me/history ...)가 백엔드 API와
        # 같은 접두사를 쓴다. nginx는 접두사로 location을 고르기 때문에, F5를 누르면 이 블록이
        # 먼저 잡히고 요청이 백엔드로 가버린다. 그런데 주소창 이동에는 Authorization 헤더가
        # 안 실리므로 스프링이 401을 내고, 화면에는 {"message":"인증이 필요합니다."} JSON이
        # 그대로 그려진다(2026-08-20 강 리포트 - 8개 경로가 같은 증상이었다).
        #
        # 브라우저 문서 요청은 Accept에 text/html이 들어가고, fetch/XHR은 안 들어간다(FE의
        # authedFetch는 Accept를 설정하지 않아 */*로 나간다). 그 차이로 갈라서 문서 요청만
        # SPA로 되돌린다 - URL을 안 바꿔도 되고, 앞으로 라우트를 추가해도 같은 함정에 안 빠진다.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # /me/documents/upload(com.dpp.dpp.controller.DocumentSlotController)가 이 블록을
        # 타는데, nginx 기본 client_max_body_size(1m)로는 PDF 문서 업로드가 다 막힌다 -
        # /document/ 블록과 같은 값으로 맞춤(2026-08-14).
        client_max_body_size 20m;
    }

    # com.dpp.dpp.controller.PublicPassportController - QR/링크로 로그인 없이 DPP 조회
    # (2026-08-18). Authorization 헤더를 안 붙여도 되지만 붙여도 무해하니 다른 블록과
    # 통일해서 그대로 전달한다.
    location /public/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notifications {
        # 브라우저 주소창 이동·새로고침이면 API가 아니라 SPA를 준다.
        #
        # 프론트 라우트(/admin/dashboard, /customs/clearance, /me/history ...)가 백엔드 API와
        # 같은 접두사를 쓴다. nginx는 접두사로 location을 고르기 때문에, F5를 누르면 이 블록이
        # 먼저 잡히고 요청이 백엔드로 가버린다. 그런데 주소창 이동에는 Authorization 헤더가
        # 안 실리므로 스프링이 401을 내고, 화면에는 {"message":"인증이 필요합니다."} JSON이
        # 그대로 그려진다(2026-08-20 강 리포트 - 8개 경로가 같은 증상이었다).
        #
        # 브라우저 문서 요청은 Accept에 text/html이 들어가고, fetch/XHR은 안 들어간다(FE의
        # authedFetch는 Accept를 설정하지 않아 */*로 나간다). 그 차이로 갈라서 문서 요청만
        # SPA로 되돌린다 - URL을 안 바꿔도 되고, 앞으로 라우트를 추가해도 같은 함정에 안 빠진다.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # com.dpp.document - 문서 업로드(파서/ZKP 연동). 성적서 PDF + 증명 생성 왕복이라
    # 기본 60s proxy 타임아웃보다 넉넉히 잡아야 함(zkp 증명 생성만 수십 초).
    location /document/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # com.dpp.mypage.controller.AdminOrganizationController - 관리자 가입승인.
    location /admin/ {
        # 브라우저 주소창 이동·새로고침이면 API가 아니라 SPA를 준다.
        #
        # 프론트 라우트(/admin/dashboard, /customs/clearance, /me/history ...)가 백엔드 API와
        # 같은 접두사를 쓴다. nginx는 접두사로 location을 고르기 때문에, F5를 누르면 이 블록이
        # 먼저 잡히고 요청이 백엔드로 가버린다. 그런데 주소창 이동에는 Authorization 헤더가
        # 안 실리므로 스프링이 401을 내고, 화면에는 {"message":"인증이 필요합니다."} JSON이
        # 그대로 그려진다(2026-08-20 강 리포트 - 8개 경로가 같은 증상이었다).
        #
        # 브라우저 문서 요청은 Accept에 text/html이 들어가고, fetch/XHR은 안 들어간다(FE의
        # authedFetch는 Accept를 설정하지 않아 */*로 나간다). 그 차이로 갈라서 문서 요청만
        # SPA로 되돌린다 - URL을 안 바꿔도 되고, 앞으로 라우트를 추가해도 같은 함정에 안 빠진다.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # com.dpp.verify.controller.DppRegistryController - EU 시장감시/관세청 DPP 검색.
    location /verify/ {
        # 브라우저 주소창 이동·새로고침이면 API가 아니라 SPA를 준다.
        #
        # 프론트 라우트(/admin/dashboard, /customs/clearance, /me/history ...)가 백엔드 API와
        # 같은 접두사를 쓴다. nginx는 접두사로 location을 고르기 때문에, F5를 누르면 이 블록이
        # 먼저 잡히고 요청이 백엔드로 가버린다. 그런데 주소창 이동에는 Authorization 헤더가
        # 안 실리므로 스프링이 401을 내고, 화면에는 {"message":"인증이 필요합니다."} JSON이
        # 그대로 그려진다(2026-08-20 강 리포트 - 8개 경로가 같은 증상이었다).
        #
        # 브라우저 문서 요청은 Accept에 text/html이 들어가고, fetch/XHR은 안 들어간다(FE의
        # authedFetch는 Accept를 설정하지 않아 */*로 나간다). 그 차이로 갈라서 문서 요청만
        # SPA로 되돌린다 - URL을 안 바꿔도 되고, 앞으로 라우트를 추가해도 같은 함정에 안 빠진다.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # com.dpp.customs.controller.CustomsClearanceController - 세관 통관 신청/큐/결정.
    # 2026-08-19 통관 관할(수출국+수입국) 기능 추가 당시 이 파일에 반영이 누락됐던 것을
    # 감사 로그 작업 중 발견해서 같이 고침 - 이게 없으면 dev/운영 둘 다 /customs/*
    # 요청이 백엔드로 못 가서 통관 화면이 전부 404였다.
    location /customs/ {
        # 브라우저 주소창 이동·새로고침이면 API가 아니라 SPA를 준다.
        #
        # 프론트 라우트(/admin/dashboard, /customs/clearance, /me/history ...)가 백엔드 API와
        # 같은 접두사를 쓴다. nginx는 접두사로 location을 고르기 때문에, F5를 누르면 이 블록이
        # 먼저 잡히고 요청이 백엔드로 가버린다. 그런데 주소창 이동에는 Authorization 헤더가
        # 안 실리므로 스프링이 401을 내고, 화면에는 {"message":"인증이 필요합니다."} JSON이
        # 그대로 그려진다(2026-08-20 강 리포트 - 8개 경로가 같은 증상이었다).
        #
        # 브라우저 문서 요청은 Accept에 text/html이 들어가고, fetch/XHR은 안 들어간다(FE의
        # authedFetch는 Accept를 설정하지 않아 */*로 나간다). 그 차이로 갈라서 문서 요청만
        # SPA로 되돌린다 - URL을 안 바꿔도 되고, 앞으로 라우트를 추가해도 같은 함정에 안 빠진다.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # com.dpp.audit.controller.AuditLogController - EU 시장감시 감사 로그 조회.
    location /audit-log {
        # 브라우저 주소창 이동·새로고침이면 API가 아니라 SPA를 준다.
        #
        # 프론트 라우트(/admin/dashboard, /customs/clearance, /me/history ...)가 백엔드 API와
        # 같은 접두사를 쓴다. nginx는 접두사로 location을 고르기 때문에, F5를 누르면 이 블록이
        # 먼저 잡히고 요청이 백엔드로 가버린다. 그런데 주소창 이동에는 Authorization 헤더가
        # 안 실리므로 스프링이 401을 내고, 화면에는 {"message":"인증이 필요합니다."} JSON이
        # 그대로 그려진다(2026-08-20 강 리포트 - 8개 경로가 같은 증상이었다).
        #
        # 브라우저 문서 요청은 Accept에 text/html이 들어가고, fetch/XHR은 안 들어간다(FE의
        # authedFetch는 Accept를 설정하지 않아 */*로 나간다). 그 차이로 갈라서 문서 요청만
        # SPA로 되돌린다 - URL을 안 바꿔도 되고, 앞으로 라우트를 추가해도 같은 함정에 안 빠진다.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    # React Router SPA: 위 경로들에 안 걸리면 전부 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
