# 저장소 경로: FE/nginx.conf 로 저장하세요.
# React Router(react-router-dom) SPA 라우팅 대응 + 백엔드 API 리버스 프록시
#
# 지금 백엔드에 확인된 경로는 /auth/sns/* 뿐이라 우선 /auth, /api, springdoc 경로만 프록시합니다.
# 백엔드에 새 API 경로(prefix)가 추가되면 이 파일에 location 블록을 추가해주세요.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    # React Router SPA: 위 경로들에 안 걸리면 전부 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
