# 저장소 경로: FE/nginx.conf 로 저장하세요.
# React Router(react-router-dom) SPA 라우팅 대응 + 백엔드 API 리버스 프록시
#
# 백엔드에 새 API 경로(prefix)가 추가되면 이 파일에 location 블록을 추가해주세요.
# /me, /notifications 는 GET /me(마이페이지), GET /me/scans(스캔 이력), GET /notifications*
# 컨트롤러가 openapi.yaml 스펙대로 루트 경로에 매핑돼 있어서 추가함 (com.dpp.mypage / com.dpp.notify).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /me {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /me/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /notifications {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # com.dpp.document - 문서 업로드(파서/ZKP 연동). 성적서 PDF + 증명 생성 왕복이라
    # 기본 60s proxy 타임아웃보다 넉넉히 잡아야 함(zkp 증명 생성만 수십 초).
    location /document/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    # React Router SPA: 위 경로들에 안 걸리면 전부 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
