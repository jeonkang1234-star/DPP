spring:
  application:
    name: dpp-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/dpp
    username: dpp
    password: dpp
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 5
server:
  port: 8080
jwt:
  secret: "change-me-in-application-local-yml"
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000
# 카카오/구글/네이버 개발자 콘솔에서 발급받은 값으로 채우세요.
# 실제 값은 application-local.yml에만 넣습니다 (이 파일은 git에 커밋됨).
oauth:
  kakao:
    client-id: ""
    client-secret: ""
    redirect-uri: http://localhost:8080/auth/sns/kakao/callback
  google:
    client-id: ""
    client-secret: ""
    redirect-uri: http://localhost:8080/auth/sns/google/callback
  naver:
    client-id: ""
    client-secret: ""
    redirect-uri: http://localhost:8080/auth/sns/naver/callback
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html