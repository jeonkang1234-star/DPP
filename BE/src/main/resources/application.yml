spring:
  application:
    name: dpp-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dpp}
    username: ${SPRING_DATASOURCE_USERNAME:dpp}
    password: ${SPRING_DATASOURCE_PASSWORD:dpp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 5
  # app.mail.enabled=true 로 켤 때만 실제로 쓰인다. 값은 application-local.yml에만 채울 것.
  mail:
    host: ""
    port: 587
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080
  error:
    # ResponseStatusException(reason=...)에 담은 한글 메시지를 FE가 그대로 보여줄 수 있게 노출.
    # (기본값 never라 지금까지는 {"status":400,"error":"Bad Request"}만 내려가고 이유가 잘렸었음)
    include-message: always
    include-binding-errors: always
jwt:
  secret: "${JWT_SECRET:change-me-in-application-local-yml}"
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000
# 카카오/구글/네이버 개발자 콘솔에서 발급받은 값으로 채우세요.
# 실제 값은 application-local.yml에만 넣습니다 (이 파일은 git에 커밋됨).
oauth:
  kakao:
    client-id: ""
    client-secret: ""
    redirect-uri: http://localhost:8080/auth/sns/kakao/callback
  google:
    client-id: ""
    client-secret: ""
    redirect-uri: http://localhost:8080/auth/sns/google/callback
  naver:
    client-id: ""
    client-secret: ""
    redirect-uri: http://localhost:8080/auth/sns/naver/callback
# 회원가입 이메일 인증코드 발송. 기본은 false라 콘솔 로그로만 찍힌다(ConsoleSignupMailSender).
# 실제 SMTP로 보내려면 true로 바꾸고 위 spring.mail.* 값을 application-local.yml에 채우세요.
app:
  mail:
    enabled: false
    from: no-reply@ieum.io
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # spring.mail.host가 비어있어도 스타터가 클래스패스에 있으면 Actuator가
    # 자동으로 메일 서버 연결 헬스체크를 만든다. app.mail.enabled=false인 동안은
    # 이 체크가 항상 실패해서 전체 /actuator/health를 DOWN으로 만들어버리므로 꺼둔다.
    mail:
      enabled: false
