spring:
  application:
    name: dpp-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/dpp
    username: dpp
    password: dpp
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: change-me-in-application-local-yml
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
