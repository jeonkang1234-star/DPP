plugins {
    id 'java'
    id 'application'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

group 'com.dpp'
version '0.0.1-SNAPSHOT'

// Gradle 9+/10에서는 project.sourceCompatibility 같은 암묵적 단축 프로퍼티가 제거됐음
// (org.gradle.api.Project에 그 프로퍼티가 없다는 에러가 남) -> java { } 블록으로 명시해야 함.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Fabric 2.5.x 체인코드 shim (peer 쪽 버전과 맞춰야 함 - EC2 부트스트랩에서 설치한 Fabric 2.5.9 기준)
    implementation group: 'org.hyperledger.fabric-chaincode-java', name: 'fabric-chaincode-shim', version: '2.5.4'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'

    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.9.2'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.24.2'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '4.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.9.2'
}

// Fabric peer가 external builder로 이 체인코드를 빌드/실행할 때 진입점으로 사용
// (mainClassName은 예전 application 플러그인 단축 프로퍼티라 같은 이유로 Gradle 9+에서 깨짐 -> mainClass만 사용)
application {
    mainClass = 'org.hyperledger.fabric.contract.ContractRouter'
}

test {
    useJUnitPlatform()
}
