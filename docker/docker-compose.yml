# 저장소 경로: docker/docker-compose.yml (기존 파일 덮어쓰기)
services:
  postgres:
    image: postgres:16
    container_name: dpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dpp
      POSTGRES_USER: dpp
      POSTGRES_PASSWORD: dpp
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpp -d dpp"]
      interval: 5s
      timeout: 5s
      retries: 10

  parser:
    build:
      context: ../parser
      dockerfile: Dockerfile
    container_name: dpp-parser
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  zkp:
    build:
      context: ../zkp-o1js
      dockerfile: Dockerfile
    container_name: dpp-zkp
    restart: unless-stopped
    # 회로 컴파일이 서버 기동 시 순차로 다 끝나야 /health가 응답한다(server.mjs가
    # server.listen()보다 앞에서 전부 await compile() 함). 회로 1개당 환경에 따라 최대
    # 90초 가까이 걸릴 수 있고(SteelMillCheck 기준 실측), 2026-08-16 배터리 도메인
    # 추가로 회로가 4개(Steel/Cbam/Fiber/Oekotex)에서 6개(+Battery/Recycling)로 늘면서
    # 기존 60s/10회(총 160s 예산)로는 실제로 166.5s에 unhealthy 판정이 나는 걸 확인했다
    # (강 리포트, docker compose up 로그) - 예산을 넉넉히 늘린다.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  backend:
    build:
      context: ../BE
      dockerfile: Dockerfile
    container_name: dpp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      parser:
        condition: service_healthy
      zkp:
        condition: service_healthy
    # 배포 환경(EC2)용 시크릿. 이 파일이 없으면 아무 것도 주입되지 않고 지금까지와 똑같이
    # 동작한다(로컬은 application-local.yml이 값을 준다). 채울 키 목록은 .env.example 참고.
    #
    # 왜 필요한가: 메일·OAuth 값이 BE/src/main/resources/application-local.yml에만 있었고
    # 그 파일은 git에 없다. CD로 배포된 EC2에는 값이 아예 존재하지 않아서, 퍼블릭 IP로
    # 접속하면 SNS 로그인도 인증 메일도 동작하지 않았다(2026-08-22 강 리포트).
    # 형식을 단순 문자열로 두는 이유: path/required 키는 Compose v2.24+ 에서만 인식된다.
    # 대신 이 파일은 "항상 존재해야" 하므로, 로컬은 .env.example을 복사해 만들고 배포는
    # CD 스크립트가 touch로 보장한다(내용이 비어 있어도 문제없다).
    env_file:
      - .env
    environment:
      # 리스트 형식인 이유: "이름만" 적으면 호스트/.env에 그 변수가 있을 때만 컨테이너로
      # 전달되고, 없으면 아예 설정되지 않는다. map 형식으로 ${VAR:-} 를 쓰면 변수가 없어도
      # 빈 문자열이 "설정된" 상태가 되는데, 스프링에서 환경변수는 application-local.yml보다
      # 우선순위가 높아서 로컬에서 멀쩡히 쓰던 값을 빈 값으로 덮어써 버린다.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dpp
      - SPRING_DATASOURCE_USERNAME=dpp
      - SPRING_DATASOURCE_PASSWORD=dpp
      # 로컬에만 있는 application-local.yml을 읽게 하는 프로파일. EC2에는 그 파일이 없고,
      # 없어도 오류가 아니다(위 env_file이 그 자리를 대신한다).
      - SPRING_PROFILES_ACTIVE=local
      - DOCUMENT_PARSER_URL=http://parser:8000
      - DOCUMENT_ZKP_URL=http://zkp:4001
    volumes:
      # 업로드된 문서 원본. document.file_uri가 이 안의 경로를 가리킨다.
      - ./document-uploads:/data/document-uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../FE
      dockerfile: Dockerfile
      args:
        # 공개 여권 QR 주소의 "최후 수단" 값 - 브라우저가 접속한 origin이 localhost/
        # 127.0.0.1일 때만 쓰인다(FE/src/publicUrl.js). EC2나 PC의 LAN IP로 열었다면
        # 지금 보고 있는 그 주소가 자동으로 우선한다 - 그 DPP가 실제로 있는 DB는 지금
        # 접속한 서버의 DB이기 때문.
        # 기본값은 EC2 퍼블릭 IP(2026-08-20, 도메인 구매 전). 다른 값을 쓰려면:
        #   VITE_PUBLIC_BASE_URL=http://192.168.0.10 docker compose ... build frontend
        VITE_PUBLIC_BASE_URL: "${VITE_PUBLIC_BASE_URL:-http://15.134.9.240}"
    container_name: dpp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

# ─────────────────────────────────────────────
# 시크릿은 docker-compose.yml에 직접 넣지 않고 BE/src/main/resources/application-local.yml
# (git 미포함, .gitignore에 이미 제외돼있음)에 둔다. 이 파일은 Docker 빌드 컨텍스트에는
# 포함되므로(로컬 디스크 기준 COPY) 이미지에는 반영되지만, git에는 절대 커밋되지 않는다.
# 서버 배포 시에도 EC2에 이 파일을 직접 배치해야 SNS 로그인/JWT가 정상 동작한다.
# ─────────────────────────────────────────────
