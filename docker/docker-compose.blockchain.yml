# EC2 전용 오버레이 - 로컬 개발 환경에는 절대 적용하지 않는다(로컬엔 Fabric 네트워크가 없음).
#
# 적용 (docker/ 디렉터리에서):
#   docker compose -f docker-compose.yml -f docker-compose.blockchain.yml up -d --build backend
#
# 전제조건:
#   1. EC2에 fabric-samples/test-network가 이미 떠 있고(docker network 이름: fabric_test),
#      dppchannel 채널에 dpp-ledger-chaincode가 install/approve/commit까지 끝난 상태.
#   2. /opt/app/fabric-identity/ 에 다음 3개 파일이 있어야 함(전부 test-network의
#      cryptogen 산출물에서 복사 - 실제 운영 인증서 아님, 데모/테스트망 전용):
#        - admin-cert.pem   (Org1 Admin의 signcert)
#        - admin-key.pem    (Org1 Admin의 개인키)
#        - peer-tls-ca.pem  (peer0.org1의 TLS root CA)
#
# .github/workflows/cd.yml이 배포할 때마다 /opt/app/fabric-identity/admin-cert.pem 존재
# 여부를 확인해서 있으면 이 오버레이를 자동으로 포함한다(2026-08-13~). 그 파일이 없으면
# 오버레이 없이 BLOCKCHAIN_ENABLED=false로 배포하고 CD 자체는 실패시키지 않는다 - Fabric
# 네트워크가 아직 없는 새 EC2 인스턴스에서도 CD가 안전하게 돌아가게 하기 위함.
# 수동 적용이 필요할 땐 여전히 아래 명령을 그대로 쓰면 된다:
services:
  backend:
    environment:
      BLOCKCHAIN_ENABLED: "true"
      BLOCKCHAIN_PEER_ENDPOINT: peer0.org1.example.com:7051
      BLOCKCHAIN_PEER_HOSTNAME_OVERRIDE: peer0.org1.example.com
      BLOCKCHAIN_MSP_ID: Org1MSP
      BLOCKCHAIN_CHANNEL_NAME: dppchannel
      BLOCKCHAIN_CHAINCODE_NAME: dpp-ledger-chaincode
      BLOCKCHAIN_TLS_CERT_PATH: /fabric-identity/peer-tls-ca.pem
      BLOCKCHAIN_CERT_PATH: /fabric-identity/admin-cert.pem
      BLOCKCHAIN_KEY_PATH: /fabric-identity/admin-key.pem
    volumes:
      - ../fabric-identity:/fabric-identity:ro
    networks:
      - default
      - fabric_test

networks:
  fabric_test:
    external: true
