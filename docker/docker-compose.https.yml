# HTTPS 오버레이(2026-10-08) - 도메인 + Let's Encrypt 인증서가 있을 때만 쓴다.
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# CD(.github/workflows/cd.yml)는 docker/.env 의 DPP_DOMAIN 과 그 도메인의 인증서
# (/etc/letsencrypt/live/<도메인>/fullchain.pem)가 둘 다 있으면 자동으로 이 파일을 얹는다.
# 처음 설정하는 방법은 docker/HTTPS.md.
services:
  frontend:
    environment:
      - DPP_DOMAIN=${DPP_DOMAIN}
    ports:
      - "443:443"
    volumes:
      # nginx 공식 이미지가 시작할 때 이 템플릿의 ${DPP_DOMAIN}을 채워 conf.d/default.conf 를 만든다.
      - ./nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
