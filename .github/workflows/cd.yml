name: CD

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Runner IP
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Open SSH for this runner
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ip }}/32
          sleep 5

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/app

            if ! git fetch origin main; then
              echo "fetch 실패 - origin/main 추적 ref를 재생성하고 재시도"
              git update-ref -d refs/remotes/origin/main || true
              git pack-refs --all --prune || true
              git fetch origin main
            fi

            git reset --hard FETCH_HEAD
            git log --oneline -1

            cd docker
            if [ ! -f .env ]; then
              echo "WARNING: /opt/app/docker/.env 없음 - 빈 파일로 생성합니다."
              touch .env
            fi

            COMPOSE_FILES="-f docker-compose.yml"
            if [ -f /opt/app/fabric-identity/admin-cert.pem ]; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.blockchain.yml"
              echo "Fabric identity 확인됨 - blockchain 오버레이 적용"
            else
              echo "WARNING: fabric-identity 없음 - blockchain 오버레이 생략"
            fi

            docker compose $COMPOSE_FILES down --remove-orphans || true
            docker compose $COMPOSE_FILES pull || true
            docker compose $COMPOSE_FILES build

            docker compose $COMPOSE_FILES up -d --remove-orphans \
              || (echo "up 1차 실패 - 5초 대기 후 재시도" && sleep 5 \
                  && docker compose $COMPOSE_FILES up -d --remove-orphans)
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            cd /opt/app/docker
            COMPOSE_FILES="-f docker-compose.yml"
            if [ -f /opt/app/fabric-identity/admin-cert.pem ]; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.blockchain.yml"
            fi
            for i in $(seq 1 40); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null; then
                echo "backend UP"; break
              fi
              echo "backend 대기 중 ($i/40)"; sleep 5
              if [ "$i" -eq 40 ]; then
                docker compose $COMPOSE_FILES logs --tail=100
                exit 1
              fi
            done
            curl -f http://localhost/ > /dev/null \
              || (docker compose $COMPOSE_FILES logs frontend --tail=100 && exit 1)

      - name: Close SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ip }}/32